<title>Outreach Live</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="showcss">
:root{--bg:#040b1a;--bg2:#0a1630;--line:rgba(120,210,230,.16);--ink:#eef5ff;--ink2:#a9bddb;--muted:#6f86a8;--cyan:#3ce0f0;--coral:#ff7a66;--gold:#f2c766;--ok:#6fdca0;
  --serif:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
:root[data-theme="light"],:root:not([data-theme]){color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--serif);overflow:hidden;height:100%}
#app{height:100%}
/* blank screen */
.off{height:100%;display:grid;place-items:center;text-align:center;padding:16px;background:radial-gradient(ellipse at 50% 60%,#0c1d3d 0,var(--bg) 70%)}
.off b{display:block;font-size:clamp(20px,3.2vmin,34px);font-weight:600;margin-bottom:6px}
.off span{color:var(--muted);font-size:clamp(14px,2vmin,20px)}
.off i{display:block;width:12px;height:12px;border-radius:50%;background:var(--muted);margin:0 auto 18px;opacity:.6}
/* owner bar */
.bar{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0b1730;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.bar .st{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.bar .st i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.bar .st.live i{background:var(--ok);box-shadow:0 0 0 4px rgba(111,220,160,.2)}
.bar .st.wait i{background:var(--gold)}
.bar .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button,.fs{font:600 13px var(--serif);padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);cursor:pointer}
.bar button.stop{background:var(--coral);border-color:var(--coral);color:#140504}
.stage{position:relative;height:100%}
.bar + .stage{height:calc(100% - 56px)}
.fs{position:fixed;left:12px;bottom:12px;opacity:.25;z-index:5}
.fs:hover{opacity:1}
/* the show */
.show{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(0,.62fr);gap:1.6vmin;padding:2.4vmin 3vmin 2.6vmin;
  background:radial-gradient(ellipse 70% 60% at 30% 60%,rgba(60,224,240,.07),transparent 70%),radial-gradient(ellipse 50% 50% at 85% 10%,rgba(255,122,102,.06),transparent 70%),var(--bg)}
.hd{display:flex;align-items:baseline;gap:1.6vmin;flex-wrap:wrap}
.hd h1{margin:0;font-size:3.4vmin;font-weight:800;letter-spacing:-.01em}
.hd .by{color:var(--ink2);font-size:2vmin}
.hd .lv{margin-left:auto;font:600 1.5vmin var(--mono);letter-spacing:.2em;color:var(--coral);display:flex;align-items:center;gap:.8vmin}
.hd .lv i{width:1.1vmin;height:1.1vmin;border-radius:50%;background:var(--coral);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vmin}
.k{position:relative;padding:1.6vmin 2vmin;border-radius:1.4vmin;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);overflow:hidden;opacity:0;transform:translateY(1.5vmin);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.k:nth-child(2){animation-delay:.12s}.k:nth-child(3){animation-delay:.24s}.k:nth-child(4){animation-delay:.36s}
@keyframes up{to{opacity:1;transform:none}}
.k .n{font-size:8.6vmin;font-weight:800;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.k .l{margin-top:.8vmin;font-size:1.9vmin;color:var(--ink2)}
.k .s{font:600 1.35vmin var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.5vmin}
.k.c1 .n{color:var(--ink)}.k.c2 .n{color:var(--cyan)}.k.c3 .n{color:var(--coral)}.k.c4 .n{color:var(--gold)}
.k::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.35vmin;background:currentColor;opacity:.0}
.mid{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6vmin;min-height:0}
.panel{border:1px solid var(--line);border-radius:1.4vmin;background:rgba(10,22,48,.55);padding:1.6vmin 2vmin;min-height:0;position:relative;overflow:hidden}
.panel h2{margin:0 0 1vmin;font:600 1.35vmin var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.map{padding:0}
.map h2{position:absolute;left:2vmin;top:1.6vmin;z-index:2}
.map svg{width:100%;height:100%;display:block}
.legend{position:absolute;left:2vmin;bottom:1.4vmin;display:flex;gap:1.6vmin;font-size:1.5vmin;color:var(--ink2);z-index:2;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:.6vmin}
.legend i{width:1.1vmin;height:1.1vmin;border-radius:50%}
.right{display:grid;grid-template-rows:minmax(0,1.25fr) minmax(0,.75fr);gap:1.6vmin;min-height:0}
.fun{display:flex;flex-direction:column;justify-content:space-between;height:calc(100% - 2.6vmin)}
.fr{display:grid;grid-template-columns:15vmin 1fr 7vmin;align-items:center;gap:1.2vmin;font-size:1.75vmin}
.fr .lab{color:var(--ink2);white-space:nowrap}
.fr .trk{display:block;height:2.2vmin;border-radius:.6vmin;background:rgba(255,255,255,.04);overflow:hidden}
.fr .fil{display:block;height:100%;width:0;border-radius:.6vmin;background:linear-gradient(90deg,rgba(60,224,240,.55),var(--cyan));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.fr.hot .fil{background:linear-gradient(90deg,rgba(255,122,102,.55),var(--coral))}
.fr.gold .fil{background:linear-gradient(90deg,rgba(242,199,102,.55),var(--gold))}
.fr .v{text-align:right;font:600 2vmin var(--mono);font-variant-numeric:tabular-nums}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:1.4vmin;height:calc(100% - 2.6vmin)}
.arm{border-radius:1vmin;padding:1.2vmin 1.4vmin;background:rgba(255,255,255,.03);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.arm b{font-size:1.75vmin;font-weight:600}
.arm small{color:var(--muted);font-size:1.4vmin;display:block;margin-top:.3vmin}
.arm .big{font-size:4.4vmin;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.arm .big em{font-style:normal;font-size:1.6vmin;color:var(--ink2);font-weight:400;margin-left:.6vmin}
.arm.b{border-color:rgba(242,199,102,.35)}.arm.b .big{color:var(--gold)}
.bot{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:1.6vmin;min-height:0}
.days{display:flex;align-items:flex-end;gap:.5vmin;height:calc(100% - 5.2vmin)}
.days i{flex:1;background:linear-gradient(180deg,var(--cyan),rgba(60,224,240,.25));border-radius:.4vmin .4vmin 0 0;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.dx{display:flex;justify-content:space-between;font:1.3vmin var(--mono);color:var(--muted);margin-top:.6vmin}
.quote{display:flex;flex-direction:column;justify-content:center;height:calc(100% - 2.6vmin)}
.quote q{font-size:3vmin;font-weight:600;line-height:1.25;quotes:"\201C" "\201D";transition:opacity .6s, transform .6s}
.quote .who{margin-top:1vmin;color:var(--coral);font:600 1.5vmin var(--mono);letter-spacing:.08em;text-transform:uppercase;transition:opacity .6s}
.quote.fade q,.quote.fade .who{opacity:0;transform:translateY(.8vmin)}
.chips{display:flex;flex-wrap:wrap;gap:.7vmin;align-content:flex-start}
.chips span{border:1px solid var(--line);border-radius:999px;padding:.45vmin 1.1vmin;font-size:1.55vmin;color:var(--ink2);opacity:0;animation:up .5s forwards}
.chips span b{color:var(--ink);font-weight:600;margin-left:.5vmin;font-family:var(--mono)}
.foot{position:absolute;right:3vmin;bottom:.7vmin;font:1.2vmin var(--mono);color:var(--muted);letter-spacing:.06em}
@keyframes drop{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:scale(1)}}
.dot{transform-box:fill-box;transform-origin:center;opacity:0;animation:drop .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ring{from{r:0;opacity:.8}to{r:4.5;opacity:0}}
.ring{fill:none;stroke-width:.22;animation:ring 2.6s ease-out infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.sweep{transform-origin:605px 578.6px;animation:sweep 6s linear infinite}
@media (max-aspect-ratio:1/1){.show{grid-template-rows:auto auto minmax(0,1fr) auto}.hero{grid-template-columns:repeat(2,1fr)}.mid{grid-template-columns:1fr}.right{display:none}.bot{grid-template-columns:1fr}.bot>.panel:not(.q){display:none}}
</style>

  for(var y=542;y<614;y+=4)s+='<line x1="527" y1="'+y+'" x2="683" y2="'+y+'" stroke="rgba(120,210,230,.05)" stroke-width=".12"/>';
  ['NY','MA','RI','CT'].forEach(function(k){(MAP[k]||[]).forEach(function(p){s+='<path d="'+path(p)+'" fill="'+(k==='CT'?'rgba(60,224,240,.06)':'rgba(255,255,255,.02)')+'" stroke="'+(k==='CT'?'rgba(120,210,230,.55)':'rgba(120,210,230,.22)')+'" stroke-width="'+(k==='CT'?.35:.25)+'"/>'})});
  s+='<text x="592" y="609" fill="rgba(169,189,219,.3)" font-size="4" font-family="JetBrains Mono" letter-spacing="1.5">CONNECTICUT</text><text x="636" y="549" fill="rgba(169,189,219,.25)" font-size="3.4" font-family="JetBrains Mono" letter-spacing="1">MASSACHUSETTS</text><text x="650" y="600" fill="rgba(169,189,219,.25)" font-size="3.4" font-family="JetBrains Mono" letter-spacing="1">RHODE ISLAND</text>';
  s+='<circle cx="605" cy="578.6" r="30" fill="url(#glow)"/><circle cx="605" cy="578.6" r="10" fill="none" stroke="rgba(60,224,240,.12)" stroke-width=".15"/><circle cx="605" cy="578.6" r="20" fill="none" stroke="rgba(60,224,240,.09)" stroke-width=".15"/><circle cx="605" cy="578.6" r="30" fill="none" stroke="rgba(60,224,240,.06)" stroke-width=".15"/><g class="sweep"><path d="M605 578.6 L635 578.6 A30 30 0 0 0 626.2 557.4 Z" fill="url(#sw)"/></g>';
  var col={1:'#2b6b86',2:'#3ce0f0',3:'#ff7a66',4:'#f2c766'}, rad={1:.32,2:.45,3:.8,4:1};
  var sorted=dots.slice().sort(function(a,b){return a[2]-b[2]});
  var n=sorted.length;
  sorted.forEach(function(d,i){
    if(d[0]<vb[0]||d[0]>vb[0]+vb[2]||d[1]<vb[1]||d[1]>vb[1]+vb[3])return;
    var delay=(0.4+i/n*2.6).toFixed(2);
    s+='<circle class="dot" cx="'+d[0]+'" cy="'+d[1]+'" r="'+rad[d[2]]+'" fill="'+col[d[2]]+'" fill-opacity="'+(d[2]===1?.55:.95)+'" style="animation-delay:'+delay+'s"/>';
    if(d[2]>=3)s+='<circle class="ring" cx="'+d[0]+'" cy="'+d[1]+'" stroke="'+col[d[2]]+'" style="animation-delay:'+(3+i%7*.37).toFixed(2)+'s"/>';
  });
  s+='<circle cx="605" cy="578.6" r=".8" fill="#fff"/><text x="606.6" y="577.4" fill="#fff" font-size="2.4" font-family="Bricolage Grotesque" font-weight="600">UConn</text>';
  return s+'</svg>';
}
function animate(root){
  var t0=performance.now(),dur=2200;
  var els=[].slice.call(root.querySelectorAll('[data-n]'));
  function tick(t){var p=Math.min(1,(t-t0)/dur),e=p===1?1:1-Math.pow(2,-10*p);
    els.forEach(function(el){var n=+el.dataset.n,txt=Math.round(n*e).toLocaleString('en-US');var em=el.querySelector('em');if(em){el.firstChild.nodeValue=txt}else el.textContent=txt});
    if(p<1)requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
  setTimeout(function(){root.querySelectorAll('.fil').forEach(function(f){f.style.width=f.dataset.w+'%'});root.querySelectorAll('.days i').forEach(function(d,i){d.style.transitionDelay=(i*.05)+'s';d.style.height=d.dataset.h+'%'})},400);
  var Q=(state.show&&state.show.quotes)||[],qi=0,box=root.querySelector('#quote');
  if(box){
    var put=function(){if(!Q.length){box.querySelector('q').textContent='Replies show up here as owners write back.';return}var q=Q[qi%Q.length];box.querySelector('q').textContent=q.t;box.querySelector('.who').textContent='— '+q.who;qi++};
    put();if(Q.length>1)setInterval(function(){box.classList.add('fade');setTimeout(function(){put();box.classList.remove('fade')},650)},6500);
  }
}

// ---------- relay (owner's tab only) ----------
async function gunzip64(b64){var bin=atob(String(b64).replace(/\s+/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
var polling=false;
async function ack(fields){try{var mcp=await claude.use('mcp');await mcp.callTool('Gmail','update_draft',{draftId:ACK_DRAFT,body:'OUTREACH-LIVE-ACK\n'+JSON.stringify(Object.assign({at:new Date().toISOString()},fields))+'\nEND'})}catch(e){}}
async function poll(){
  if(polling)return;polling=true;var wait=4000;
  try{
    var mcp=await claude.use('mcp');
    if(!mcp){msg='This view can’t reach Gmail. Open it on claude.ai while signed in.';render();wait=15000;return}
    var r=await mcp.callTool('Gmail','get_draft',{draftId:RELAY_DRAFT,messageFormat:'PLAIN_TEXT'},{cache:false});
    var m=/OUTREACH-PRESENT\s*([\s\S]*?)\s*END\s*$/.exec(String((r.payload||{}).plaintextBody||'').trim());
    var d=null;try{d=m?JSON.parse(m[1]):null}catch(e){}
    var fresh=d&&d.on&&d.mode==='show'&&d.show&&Date.now()-Date.parse(d.at||0)<60000;
    var was=relayOn;relayOn=!!fresh;
    if(!fresh){
      if(state.live&&!busy){await publish({live:false});return}
      if(was!==relayOn)render();
      wait=6000;return;
    }
    if(state.live&&state.k===d.k){await ack({k:d.k,published:true});if(was!==relayOn)render();return}
    if(!busy){await ack({k:state.k||'',published:false});var ok=await publish({live:true,mode:'show',k:d.k,at:new Date().toISOString(),show:d.show});if(ok)await ack({k:d.k,published:true})}
  }catch(e){
    var c=e&&e.code;msg=c==='needs_reauth'?'Gmail needs reconnecting: claude.ai → Settings → Connectors.':'Couldn’t check for your desk: '+String((e&&e.message)||e).slice(0,140);render();wait=10000;
  }finally{polling=false;setTimeout(poll,wait)}
}
function docFor(s){
  var reset='';var hs=document.head&&document.head.querySelector('style:not(#showcss)');if(hs)reset=hs.textContent;
  var style=document.getElementById('showcss');
  var fonts=document.getElementById('fonts');
  var main=document.getElementById('main').textContent;
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Outreach Live</title>\n'+(fonts?fonts.outerHTML+'\n':'')+'<style id="showcss">'+style.textContent+'</style>\n<script id="state" type="application/json">'+json+'<\/script>\n'+
    '<div id="app"></div>\n<script id="main">'+main+'<\/script></body></html>';
}
async function publish(s){
  busy=true;
  try{
    var art=await claude.use('artifact');
    if(!art)throw new Error('This view can’t update the page. Open it on claude.ai.');
    await art.publish(docFor(s));
    state=s;msg='';render();return true;
  }catch(e){if(!(e&&e.code==='conflict')){msg=(e&&e.code==='not_writer')?'Only the owner can put this on the big screen.':((e&&e.message)||'Couldn’t update the big screen.');render()}return false}
  finally{busy=false}
}

// ---------- page ----------
var shown='';
function render(){
  var live=state.live&&state.show;
  var bar='';
  if(isOwner){
    var cls=live?'live':relayOn?'wait':'';
    bar='<div class="bar"><span class="st '+cls+'"><i></i>'+(live?'Live on the big screen':relayOn?'Getting it ready…':'Off: the link shows a blank screen')+'</span><span class="msg">'+esc(msg||(live?'Following your desk. Keep this tab open while you present.':'Click Present to class on your outreach desk. This tab does the rest; keep it open.'))+'</span>'+(live?'<button class="stop" id="b-stop">Stop showing</button>':'')+'</div>';
  }
  var key=(live?state.k||'show':'off')+'|'+isOwner;
  if(key===shown&&app.firstChild){var b=app.querySelector('.bar');if(b&&isOwner)b.outerHTML=bar;bindBar();return}
  shown=key;
  app.innerHTML=bar+'<div class="stage">'+(live?showHtml(state.show):'<div class="off"><div><i></i><b>Nothing is being shown right now.</b><span>This screen comes on when the presenter starts.</span></div></div>')+'</div>'+(!isOwner&&live?'<button class="fs" id="b-fs">Full screen</button>':'');
  if(live)animate(app);
  bindBar();
  var fs=document.getElementById('b-fs');if(fs)fs.onclick=function(){var el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(function(){})};
}
function bindBar(){var b=document.getElementById('b-stop');if(b)b.onclick=function(){if(!busy)publish({live:false})}}
render();
(async function(){
  try{var u=await claude.use('user');isOwner=u?!!(await u.isOwner()):false}catch(e){isOwner=false}
  if(isOwner){render();poll()}
})();
})();
</script>
