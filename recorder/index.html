<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Session recorder</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#F6F9FC;--wash:#EAF0F7;--line:#CFDAE7;--ink:#0A1730;--ink-2:#2D3E5C;--muted:#5D6E89;--red:#E2493B;--red-soft:#FCE6E2;--ok:#17794A;--ok-soft:#DFF3E8;--warn:#8A6206;--warn-soft:#FBEFCF;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#081329;--wash:#0F1E3A;--line:#203559;--ink:#EEF5FF;--ink-2:#C4D3EA;--muted:#8EA2C2;--red:#FF7A66;--red-soft:#3A1A1C;--ok:#6FDCA0;--ok-soft:#0F3326;--warn:#F2C766;--warn-soft:#3A2E10;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-size:clamp(26px,6vw,36px);line-height:1.1;letter-spacing:-.02em}
.who{color:var(--muted)}
.bar{display:flex;align-items:center;gap:12px;background:var(--wash);border-radius:16px;padding:14px 16px}
.clock{font:600 34px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.live{background:var(--red-soft);color:var(--red)}
.pill.live i{background:var(--red);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.consent{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.consent input{width:22px;height:22px;accent-color:var(--red);flex-shrink:0;margin-top:1px}
.consent.ok{border-color:var(--ok);background:var(--ok-soft)}
.consent small{color:var(--muted)}
.transcript{flex:1;min-height:220px;border:1px solid var(--line);border-radius:16px;padding:14px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.6}
.transcript .interim{color:var(--muted)}
.transcript .empty{color:var(--muted);font-size:15px}
.transcript .ln{display:block;margin:0 0 10px}
.transcript .ln .tx{display:inline}
.transcript .ln .interim{color:var(--muted);font-style:italic}
.suggest{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--wash)}
.suggest[hidden]{display:none}
.suggest b{display:block;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.suggest ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:16px}
.suggest small{color:var(--muted);font-size:12px}
.transcript .tag{display:inline-block;min-width:64px;font:600 11px/1.9 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.transcript .v1 .tag{color:var(--ink-2)}
.transcript .v2 .tag{color:var(--red)}
.voices{font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:transparent;color:var(--ink);resize:vertical}
.note{font-size:14px;color:var(--muted)}
.note.warn{color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px}
.note.ok{color:var(--ok);background:var(--ok-soft);border-radius:12px;padding:10px 12px}
.actions{display:flex;gap:10px;position:sticky;bottom:0;background:var(--paper);padding-top:8px}
button{font:600 16px/1 system-ui,-apple-system,"Segoe UI",sans-serif;border-radius:999px;padding:18px 20px;cursor:pointer;flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
button.rec{background:var(--red);border-color:var(--red);color:#fff}
button.end{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit}
</style>
</head>
<body>
<main>
  <div><div class="eyebrow" id="kind">Call</div><h1 id="biz">Session</h1><div class="who" id="who"></div></div>
  <div class="bar"><span class="clock" id="clock">0:00</span><span class="pill" id="pill"><i></i><span>Not started</span></span></div>
  <label class="consent" id="consentBox"><input type="checkbox" id="consent"><span><b id="okWho">They</b> said it's OK to record. <small>Connecticut requires their OK before recording a phone call. Ask first.</small></span></label>
  <div class="note" id="msg">Tap Record once they've said OK. Keep this tab open. On a phone call, put it on speaker so the mic hears both of you. The audio is saved to your desk with the transcript.</div>
  <div class="suggest" id="suggest" hidden><b>Questions to ask next</b><ol id="suggestList"></ol></div>
  <div class="voices" id="voices"></div>
  <div class="transcript" id="live"><span class="empty">What's said shows up here.</span></div>
  <textarea id="notes" placeholder="Your notes (optional): anything the transcript might miss"></textarea>
  <div class="actions"><button class="rec" id="rec">● Record</button><button class="end" id="end" disabled>End and send to my desk</button></div>
</main>
<script src="voices.js"></script>
<script src="webm-duration.js"></script>
<script>
(() => {
'use strict';
const qs = new URLSearchParams(location.search);
const sid = qs.get('sid') || ('s' + Date.now());
const ret = qs.get('ret') || '';
const biz = qs.get('biz') || 'Session';
const person = qs.get('who') || '';
const kind = qs.get('kind') === 'meeting' ? 'meeting' : 'call';
const target = (() => { try { return JSON.parse(decodeURIComponent(escape(atob(qs.get('t') || '')))); } catch (e) { return null; } })();
const notify = qs.get('mail') || '';
const KEY = 'outreach-rec-' + sid;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const V = window.Voices;

// segs: one entry per stretch the browser writes down: {t0, t1, text, f (pitch), e (loudness)}.
let st = { segs: [], interim: '', notes: '', elapsed: 0, since: null, startedAt: null, consent: false, sent: false };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && (!saved.sent || !saved.acked)) {
    saved.sent = false;
    st = { ...st, ...saved, interim: '', since: null };
    if (!st.segs && Array.isArray(saved.finals)) st.segs = saved.finals.map(text => ({ t0: 0, t1: 0, text, f: 0, e: 0 }));
    delete st.finals;
  }
} catch (e) {}
let rec = null, listening = false, wake = null, timer = null;
// Audio: the mic stream, the recording, and pitch/loudness readings for telling voices apart.
let stream = null, actx = null, analyser = null, sampler = null, mr = null, chunks = [], mime = '', frames = [], audioOff = false, audioLost = false;
let segStart = null, lastT1 = 0;
if (qs.get('consent') === '1') st.consent = true;
if (st.startedAt && st.segs.length) audioLost = true; // reopened mid-session: audio from before is gone, the text isn't

$('biz').textContent = biz;
$('who').textContent = person;
$('okWho').textContent = person ? person.split(' ')[0] : 'They';
$('kind').textContent = kind === 'meeting' ? 'Meeting' : 'Call';
$('consent').checked = !!st.consent;
$('consentBox').classList.toggle('ok', !!st.consent);
$('notes').value = st.notes || '';
document.title = `Recording · ${biz}`;

const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ...st, interim: '', since: null, elapsed: elapsed() })); } catch (e) {} };
const elapsed = () => st.elapsed + (st.since ? Date.now() - st.since : 0);
const fmt = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };
const transcript = () => st.segs.map(s => s.text).join(' ').trim();
const split = () => V ? V.splitVoices(st.segs) : { voices: st.segs.map(() => null), two: false };

function paint() {
  const sv = split();
  const groups = [];
  st.segs.forEach((s, i) => { const v = sv.two ? sv.voices[i] : 0; const g = groups[groups.length - 1]; if (g && g.v === v) g.t.push(s.text); else groups.push({ v, t: [s.text] }); });
  const live = $('live');
  const atBottom = live.scrollHeight - live.scrollTop - live.clientHeight < 60;
  let html = groups.map(g => `<span class="ln${g.v ? ' v' + g.v : ''}">${sv.two ? `<span class="tag">${g.v ? 'Voice ' + g.v : '?'}</span>` : ''}<span class="tx">${esc(g.t.join(' '))}</span></span>`).join('');
  if (st.interim) {
    if (html) html = html.replace(/<\/span><\/span>$/, ` <span class="interim">${esc(st.interim)}</span></span></span>`);
    else html = `<span class="ln"><span class="tx"><span class="interim">${esc(st.interim)}</span></span></span>`;
  }
  live.innerHTML = html || '<span class="empty">What\'s said shows up here.</span>';
  if (atBottom) live.scrollTop = live.scrollHeight;
  $('voices').textContent = !st.segs.length ? '' : sv.two ? 'Hearing two voices. Your desk puts names on them when you end.' : (audioOff || !stream && !listening) ? '' : 'One voice so far. A second shows up once the other person has said a few things.';
  $('pill').className = 'pill' + (listening ? ' live' : '');
  $('pill').innerHTML = `<i></i><span>${listening ? 'Recording' : st.startedAt ? 'Paused' : 'Not started'}</span>`;
  $('rec').textContent = listening ? 'Pause' : (st.startedAt ? '● Keep recording' : '● Record');
  $('rec').className = listening ? '' : 'rec';
  $('end').disabled = !(transcript() || $('notes').value.trim()) || st.sent;
  $('clock').textContent = fmt(elapsed());
}

// Live copy back to the desk tab, if it opened this one.
let lastLive = 0;
function sendLive() {
  if (!window.opener || Date.now() - lastLive < 1500) return;
  lastLive = Date.now();
  const sv = split();
  try { window.opener.postMessage({ app: 'outreach-rec', type: 'live', sid, transcript: transcript(), segs: st.segs.map((s, i) => ({ text: s.text, voice: sv.voices[i] })), notes: $('notes').value, ms: elapsed() }, '*'); } catch (e) {}
}

function msg(text, cls) { $('msg').className = 'note' + (cls ? ' ' + cls : ''); $('msg').innerHTML = text; }

async function openAudio() {
  if (stream) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
  try {
    // No echo cancelling or volume leveling: those would strip the voice coming out of a speaker and hide who's louder.
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    msg(`The microphone is blocked (${esc(e.name || 'error')}). Click the mic or lock icon in the address bar, allow the microphone for this page, then tap Record again.`, 'warn');
    return false;
  }
  if (audioOff) { stream.getTracks().forEach(t => t.stop()); stream = null; return true; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    analyser = actx.createAnalyser(); analyser.fftSize = 2048;
    actx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    sampler = setInterval(() => {
      if (!listening || !V) return;
      analyser.getFloatTimeDomainData(buf);
      const r = V.pitchOf(buf, actx.sampleRate);
      frames.push({ t: elapsed(), f: r.f, rms: r.rms });
      if (frames.length > 200000) frames.splice(0, 50000);
    }, 50);
  } catch (e) { /* no pitch readings: voices just won't be split */ }
  try {
    if (window.MediaRecorder) {
      mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
      mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
      mime = mr.mimeType || mime;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    }
  } catch (e) { mr = null; }
  return true;
}
function closeAudio() {
  clearInterval(sampler); sampler = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (actx) actx.close().catch(() => {});
  actx = null; analyser = null;
}
// Some phones can't record audio and run speech-to-text at the same time: keep the text.
function dropAudio() {
  audioOff = true;
  if (mr && mr.state !== 'inactive') { try { mr.stop(); } catch (e) {} }
  closeAudio();
}

// Speech-to-text. Chrome ends it on its own every so often (silence, a network blip, a minute
// or so of talking); a fresh one is started each time so the transcript never just stops.
let srTries = 0, srHeard = false, srLast = 0, srAlive = false;
const FATAL = {
  'not-allowed': 'The microphone is blocked for this page. Click the mic or lock icon in the address bar, allow it, then tap Record again.',
  'service-not-allowed': 'This browser won\'t let the page use its speech-to-text. Open this page in Google Chrome.',
  'language-not-supported': 'English speech-to-text isn\'t available in this browser. Try Google Chrome.',
};
function listen() {
  if (!listening) return;
  const r = new SR();
  r.continuous = !IOS; r.interimResults = true; r.lang = 'en-US'; r.maxAlternatives = 1;
  r.onstart = () => { srAlive = true; srLast = Date.now(); if (srTries > 1) msg(audioOff ? 'Listening again (text only on this device).' : 'Listening and recording again.'); else msg(audioOff ? 'Listening (text only on this device). Keep this tab open until you tap End.' : 'Listening and recording. Keep this tab open until you tap End.'); };
  r.onresult = e => {
    srHeard = true; srLast = Date.now(); srTries = 0;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        const tx = String(res[0].transcript || '').trim();
        const last = st.segs[st.segs.length - 1];
        if (tx && (!last || last.text !== tx)) {
          const t1 = elapsed();
          const t0 = Math.max(lastT1, (segStart ?? t1) - 700);
          st.segs.push({ t0, t1, text: tx, ...(V ? V.segFeatures(frames, t0, t1) : { f: 0, e: 0 }) });
          lastT1 = t1;
        }
        segStart = null;
      } else interim += res[0].transcript;
    }
    if (interim && segStart === null) segStart = elapsed();
    st.interim = interim.trim(); paint(); save(); sendLive();
  };
  r.onerror = e => {
    if (rec !== r) return;
    if (FATAL[e.error]) { stopForGood(FATAL[e.error]); return; }
    if (e.error === 'audio-capture' && stream && !audioOff) { dropAudio(); msg('This device can\'t record audio and write down words at the same time, so it\'s keeping the words only.', 'warn'); }
    // no-speech, aborted, network and the rest: onend follows and starts a fresh one.
    if (e.error === 'network') msg('Speech-to-text lost its connection for a moment. Reconnecting… (the audio keeps recording)');
  };
  r.onend = () => {
    srAlive = false;
    if (rec !== r || !listening) return;
    // Keep what was half-written so nothing is lost between restarts.
    if (st.interim) { const t1 = elapsed(), t0 = Math.max(lastT1, (segStart ?? t1) - 700); st.segs.push({ t0, t1, text: st.interim, ...(V ? V.segFeatures(frames, t0, t1) : { f: 0, e: 0 }) }); lastT1 = t1; st.interim = ''; segStart = null; paint(); save(); }
    srTries++;
    setTimeout(listen, Math.min(3000, srTries < 3 ? 60 : 250 * srTries));
  };
  rec = r;
  try { r.start(); } catch (e) { srTries++; setTimeout(listen, 400); }
}
function stopForGood(why) {
  listening = false; rec = null;
  if (st.since) { st.elapsed += Date.now() - st.since; st.since = null; }
  if (mr && mr.state === 'recording') { try { mr.pause(); } catch (err) {} }
  msg(why, 'warn'); paint(); save();
}
// If Chrome goes quiet without saying so, start a fresh one.
setInterval(() => { if (listening && !srAlive && rec && Date.now() - srLast > 6000) { srLast = Date.now(); listen(); } }, 3000);

async function start() {
  if (!st.consent) { msg('Tick the box once they\'ve said it\'s OK to record.', 'warn'); return; }
  if (!SR) { msg('This browser can\'t turn speech into text. Open this page in Google Chrome (or Safari on a Mac or iPhone).', 'warn'); return; }
  if (!(await openAudio())) { paint(); return; }
  rec = null; listening = true; srTries = 0;
  listen();
  if (!st.startedAt) st.startedAt = new Date().toISOString();
  st.since = Date.now();
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  if (mr) { try { if (mr.state === 'inactive') mr.start(5000); else if (mr.state === 'paused') mr.resume(); } catch (e) {} }
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
  clearInterval(timer); timer = setInterval(() => { $('clock').textContent = fmt(elapsed()); }, 1000);
  setTimeout(() => { if (listening && !srHeard && !transcript()) msg('Listening, but nothing has come through yet. Say a few words. If nothing shows up in 10 seconds, this browser\'s speech-to-text isn\'t working here: open this page in Google Chrome.'); }, 8000);
  paint(); save();
}
function pause() {
  listening = false;
  if (st.interim) { const t1 = elapsed(); st.segs.push({ t0: Math.max(lastT1, (segStart ?? t1) - 700), t1, text: st.interim.trim(), ...(V ? V.segFeatures(frames, Math.max(lastT1, (segStart ?? t1) - 700), t1) : { f: 0, e: 0 }) }); lastT1 = t1; st.interim = ''; segStart = null; }
  if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
  if (st.since) { st.elapsed += Date.now() - st.since; st.since = null; }
  if (mr && mr.state === 'recording') { try { mr.pause(); } catch (e) {} }
  if (actx && actx.state === 'running') actx.suspend().catch(() => {});
  clearInterval(timer); if (wake) { wake.release().catch(() => {}); wake = null; }
  paint(); save();
}

// Stop the recording and hand back the audio file (or null).
function finishAudio() {
  return new Promise(res => {
    if (!mr || mr.state === 'inactive') { closeAudio(); res(chunks.length ? new Blob(chunks, { type: (mime || 'audio/webm').split(';')[0] }) : null); return; }
    mr.onstop = () => { closeAudio(); res(chunks.length ? new Blob(chunks, { type: (mime || 'audio/webm').split(';')[0] }) : null); };
    try { mr.stop(); } catch (e) { closeAudio(); res(null); }
  });
}

async function pack(obj) {
  const json = JSON.stringify(obj);
  if (window.CompressionStream) {
    const s = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const bytes = new Uint8Array(await new Response(s).arrayBuffer());
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return 'z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  return 'j' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function end() {
  pause();
  msg('Finishing up…');
  let audio = await finishAudio();
  if (audio && window.WebmDuration && /webm/.test(audio.type)) {
    try { audio = new Blob([window.WebmDuration.fix(new Uint8Array(await audio.arrayBuffer()), elapsed())], { type: audio.type }); } catch (e) { /* keep it as recorded */ }
  }
  const sv = split();
  const segs = st.segs.map((s, i) => ({ t0: s.t0, t1: s.t1, text: s.text, voice: sv.voices[i] }));
  const payload = { app: 'outreach-rec', type: 'done', sid, transcript: transcript(), segs, voices: { two: sv.two, pitch: sv.pitch || [], db: sv.db || 0 }, notes: $('notes').value.trim(), ms: elapsed(), startedAt: st.startedAt, kind, consent: !!st.consent, target, audioPartial: audioLost };
  // 1) Straight back to the desk tab that opened this one, with the audio file.
  let acked = false;
  const onAck = e => { if (e.data && e.data.app === 'outreach-rec' && e.data.type === 'ack' && e.data.sid === sid) acked = true; };
  window.addEventListener('message', onAck);
  if (window.opener) { try { window.opener.postMessage({ ...payload, audio }, '*'); } catch (e) { try { window.opener.postMessage(payload, '*'); } catch (err) {} } }
  for (let i = 0; i < 30 && !acked; i++) await new Promise(r => setTimeout(r, 100));
  window.removeEventListener('message', onAck);
  if (acked) {
    st.sent = true; st.acked = true; save();
    msg('Sent to your desk ✓ It\'s putting names on the voices and writing the summary now. You can close this tab.', 'ok');
    paint();
    setTimeout(() => { try { window.close(); } catch (e) {} }, 1500);
    return;
  }
  // 2) The desk tab isn't reachable (e.g. it was opened from the Claude app): reopen the desk with the session attached.
  //    The audio file is too big for a link, so offer to save it here.
  const packed = await pack(payload);
  const mailBody = `${kind === 'meeting' ? 'Meeting' : 'Call'} with ${person || 'the owner'} at ${biz} (${fmt(payload.ms)})\n\nTranscript:\n${payload.transcript}\n\nMy notes:\n${payload.notes}`;
  const mailHref = notify ? `mailto:${encodeURIComponent(notify)}?subject=${encodeURIComponent('Call notes: ' + (person || biz) + ' at ' + biz)}&body=${encodeURIComponent(mailBody.slice(0, 1800))}` : '';
  st.sent = false; save(); paint();
  const ext = audio && /mp4/.test(audio.type) ? 'm4a' : 'webm';
  const fname = `${biz.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'call'}-${new Date().toISOString().slice(0, 10)}.${ext}`;
  const saveLink = audio ? `<a href="${URL.createObjectURL(audio)}" download="${fname}"><b>Save the recording</b></a> (this tab couldn't reach your desk, so the audio can't go to it directly).<br><br>Then ` : '';
  window.__copyText = `${kind === 'meeting' ? 'Meeting' : 'Call'} with ${person || 'the owner'} at ${biz} (${fmt(payload.ms)})\n\nTranscript:\n${segs.map(x => (x.voice ? 'Voice ' + x.voice + ': ' : '') + x.text).join('\n')}\n\nMy notes:\n${payload.notes}`;
  msg(`<button type="button" class="end" style="flex:none;padding:12px 18px;margin-bottom:10px" onclick="navigator.clipboard.writeText(window.__copyText).then(()=>{this.textContent='Copied. Paste it to Claude.'}).catch(()=>{this.textContent='Copy failed. Try again.'})">Copy the whole call</button><br>${saveLink}${ret ? `<a href="${ret}#ses=${packed}"><b>${audio ? 'open' : 'Open'} your desk with this session</b></a>: it writes the summary and does the rest.` : ''}${mailHref ? `${ret ? '<br><br>Or ' : ''}<a href="${mailHref}">email it to yourself as call notes</a> and it's handled at the next check.` : ''}`, 'ok');
}

// Suggested questions sent from the desk while the call goes on.
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.app !== 'outreach-rec' || d.sid !== sid || d.type !== 'suggest' || !Array.isArray(d.questions)) return;
  const qs2 = d.questions.filter(q => typeof q === 'string' && q.trim()).slice(0, 3);
  $('suggest').hidden = !qs2.length;
  $('suggestList').innerHTML = qs2.map(q => `<li>${esc(q)}</li>`).join('');
});
$('consent').addEventListener('change', e => { st.consent = e.target.checked; $('consentBox').classList.toggle('ok', st.consent); if (!st.consent && listening) pause(); save(); paint(); });
$('rec').addEventListener('click', () => listening ? pause() : start());
$('end').addEventListener('click', () => { if ($('end').dataset.sure) end(); else { $('end').dataset.sure = '1'; $('end').textContent = 'Tap again to end'; setTimeout(() => { delete $('end').dataset.sure; $('end').textContent = 'End and send to my desk'; }, 4000); } });
$('notes').addEventListener('input', () => { st.notes = $('notes').value; save(); paint(); sendLive(); });
window.addEventListener('beforeunload', e => { if (listening || (mr && mr.state !== 'inactive')) { e.preventDefault(); e.returnValue = ''; } });
paint();
// Opened from "I'm on the call" on the desk: start right away (the browser may ask for the mic once).
if (qs.get('go') === '1' && st.consent && !st.startedAt && SR) setTimeout(() => start(), 300);
if (!st.startedAt) msg(SR ? 'Tap Record to start. Your browser will ask to use the microphone the first time.' : 'This browser can\'t turn speech into text. Open this page in Google Chrome (or Safari on a Mac or iPhone).', SR ? '' : 'warn');
else if (audioLost) msg('This page was reopened, so the audio from before is gone. The words are kept, and Record picks up from here.');
})();
</script>
</body>
</html>
